name: Format Comment Issue

# 博客评论 Issue 格式化：utterances 自动创建的 Issue 标题为压平后的单词元（如 comment-insightlabsoverview），
# 正文无结构。本工作流从正文链接提取文章路径，改写为模板化正文并追加 labels，便于查收、筛选、回复。
# 注意：标题中必须保留 issue-term 词元（#comment-xxx），否则 utterances 客户端的子串校验无法匹配回本 Issue
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  format:
    if: github.event.issue.user.login == 'utterances-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const term = issue.title;
            // utterances 生成的正文包含页面链接（[title](url) 形式），从中提取文章路径
            const linkMatch = (issue.body || "").match(/\]\((https?:\/\/[^)\s]+)\)/);
            const path = linkMatch ? new URL(linkMatch[1]).pathname : "";
            const pageUrl = `https://blog.insight-stack.cn${path}`;

            // 确保所需 labels 存在（不存在则创建）
            const requiredLabels = [
              { name: "blog-comment", color: "0e8a16" },
              { name: "待回复", color: "d93f0b" },
            ];
            for (const label of requiredLabels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch {
                await github.rest.issues.createLabel({ owner, repo, name: label.name, color: label.color });
              }
            }

            const body = [
              "## 💬 博客评论",
              "",
              "| 项目 | 内容 |",
              "| --- | --- |",
              `| 文章路径 | \`${path}\` |`,
              `| 直达链接 | ${pageUrl} |`,
              `| 创建时间 | ${issue.created_at} |`,
              "",
              "---",
              "",
              issue.body || "",
              "",
              "---",
              "> 本 Issue 由 utterances 根据文章页评论自动创建；在此回复会自动展示在站点文章底部。回复后 label 会自动从「待回复」翻转为「已回复」。",
            ].join("\n");

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              // 标题末尾保留 issue-term 词元：utterances 匹配 Issue 时要求标题包含该词元
              title: `💬 [评论] ${path || "未知文章"} (${term})`,
              body,
              labels: ["blog-comment", "待回复"],
            });
