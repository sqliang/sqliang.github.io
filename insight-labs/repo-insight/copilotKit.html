<!DOCTYPE html>
<!--
  旧大写 URL /insight-labs/repo-insight/copilotKit 的重定向占位页。
  GitHub Pages 不支持服务端 301，用 canonical + meta refresh + JS replace 传递迁移信号；
  搜索引擎会将权重合并到 canonical 指向的新地址。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>页面已迁移 | Insight Stack</title>
  <link rel="canonical" href="https://www.insight-stack.cn/insight-labs/repo-insight/copilot-kit">
  <meta http-equiv="refresh" content="0; url=/insight-labs/repo-insight/copilot-kit">
  <script>location.replace('/insight-labs/repo-insight/copilot-kit' + location.search + location.hash);</script>
</head>
<body>
  <p>本页面已永久迁移至 <a href="/insight-labs/repo-insight/copilot-kit">CopilotKit 项目解读</a>。</p>
</body>
</html>
